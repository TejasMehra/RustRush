name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["1.22.x", "1.24.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build ./cmd/rustrush

  rust-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install Rust compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes rustc
          rustc --version
      - name: Build, run, and correctness-check each candidate
        shell: bash
        run: |
          set -euo pipefail
          for workload in cpu json database-fixture; do
            output="$RUNNER_TEMP/rustrush-$workload"
            go run ./cmd/rustrush demo \
              --workload "$workload" \
              --iterations 10000 \
              --repetitions 3 \
              --out "$output"
            jq -e '
              .schema_version == "1.1"
              and .correctness == "PASSED_FOR_CHECKSUM"
              and (.measurements | length == 2)
              and ([.measurements[].correctness_output] | unique | length == 1)
              and all(.measurements[];
                .status == "measured"
                and .warmup_runs == 1
                and .error_count == 0
                and .repetitions == 3
                and (.samples | length) == 3
                and (. as $measurement | all($measurement.samples[]; .output == $measurement.correctness_output))
              )
            ' "$output/latest.json"
            grep -q "$(jq -r .verdict "$output/latest.json")" "$output/latest.svg"
            python3 -c "import sys,xml.dom.minidom as m; m.parse(sys.argv[1])" "$output/latest.svg"
          done
      - name: Candidate workflow with Go baseline and Rust candidate
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rustrush-candidate"
          go run ./cmd/rustrush candidate \
            --baseline examples/candidate-template/baseline \
            --candidate examples/candidate-template/candidate.rs \
            --input examples/candidate-template/input.txt \
            --iterations 10000 --repetitions 3 --allow-execute \
            --out "$output"
          jq -e '
            .correctness == "PASSED_FOR_CHECKSUM"
            and (.measurements | length == 2)
            and ([.measurements[].correctness_output] | unique | length == 1)
            and all(.measurements[]; .status == "measured" and .error_count == 0 and (.samples | length) == 3)
          ' "$output/latest.json"
          go run ./cmd/rustrush roi --report "$output/latest.json" --monthly-operations 1000000 \
            --baseline-cpu-seconds 0.01 --cpu-hour-price 0.05 --engineering-hours 10 \
            --engineering-hourly-cost 100 --monthly-maintenance-cost-delta 0 --scenarios --json > "$output/roi.json"
          jq -e --slurpfile report "$output/latest.json" '
            .report.verdict == $report[0].verdict
            and (if .report.measured_values_used then .target_cpu_source == "estimated_from_report_wall_clock_ratio"
                 else .claim == "NO_SAVINGS_CLAIM" end)
          ' "$output/roi.json"


  container-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Pull toolchain images (the tool itself never pulls)
        run: |
          docker pull golang:1.24
          docker pull rust:1
      - name: Runtime isolation probe
        run: RUSTRUSH_CONTAINER_TESTS=1 go test -count=1 -v -run TestContainerIsolationProbe ./internal/rustrush
      - name: Candidate workflow in hardened containers
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/rustrush-container"
          go run ./cmd/rustrush candidate \
            --baseline examples/candidate-template/baseline \
            --candidate examples/candidate-template/candidate.rs \
            --input examples/candidate-template/input.txt \
            --iterations 10000 --repetitions 3 --timeout 120s --allow-execute \
            --isolation container --out "$output"
          jq -e '
            .correctness == "PASSED_FOR_CHECKSUM"
            and (.environment.isolation | startswith("container"))
            and .environment.timing_mode == "container_process_isolated"
            and (.environment.container_run_overhead_ms_estimate_median | contains("derived residual estimate"))
            and (.environment.container_invocation_wall_ms_median | length > 0)
            and (.environment.timing_clock | contains("monotonic"))
            and (.environment.timing_resolution_ns | contains("empirical minimum tick"))
            and all(.measurements[].samples[]; .timer_resolution_ns > 0)
            and all(.measurements[]; .status == "measured" and .error_count == 0)
            and all(.measurements[]; .warmup_runs == 1 and (.samples | length) == 3)
          ' "$output/latest.json"
      - name: Daemon-unavailable path fails closed
        shell: bash
        run: |
          if DOCKER_HOST=unix:///nonexistent.sock go run ./cmd/rustrush candidate \
            --baseline examples/candidate-template/baseline \
            --candidate examples/candidate-template/candidate.rs \
            --iterations 1000 --allow-execute --isolation container --out "$RUNNER_TEMP/none"; then
            echo "expected failure"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/none/latest.json"
